let paused=false;const pb=document.getElementById('pb'),pz=document.getElementById('pz'),pr=document.getElementById('pr');
function setPause(v){if(!run)return;paused=v;pz.classList.toggle('hide',!v);if(v)mStop();else mStart()}
pb.onclick=()=>setPause(!paused);pr.onclick=()=>setPause(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden)setPause(true)});
reset();loop();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body>
