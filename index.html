<style>

if(end){endStep();return}t++;if(fz>0)fz--;if(hurt>0)hurt--;rz=Math.min(2,0.96*Math.pow(1.1,pw-1));P.r=14;spd=bs?1:Math.min(1.7,Math.pow(1.2,Math.floor(score/1000)));scroll=(scroll+4*spd)%60;sy+=4*spd;const st=score<1000?6:score<2000?0:score<3000?1:score<4000?2:score<7000?3:score<10000?5:4;if(st!==bgCur){bgPrev=bgCur;bgCur=st;bgF=0;cap=150}if(bgF<1)bgF=Math.min(1,bgF+0.012);if(cap>0)cap--;
